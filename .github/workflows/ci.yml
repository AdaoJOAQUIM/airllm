name: CI

# Lightweight, network-free CI: byte-compiles every module and runs a static
# analysis pass with pyflakes. This catches the class of defects found in the
# audit (unbound names, undefined-name use, syntax errors) without needing a
# GPU, large model downloads, or Hugging Face access.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.9", "3.11" ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install static-analysis tooling
        run: python -m pip install --upgrade pip pyflakes

      - name: Byte-compile all sources
        run: python -m compileall -q air_llm/airllm

      - name: Static analysis (undefined names, unbound locals)
        # Fail only on the high-signal checks (F821 undefined name,
        # F823 local used before assignment). Unused-import noise is reported
        # but not fatal so the gate stays meaningful.
        run: |
          python -m pyflakes air_llm/airllm || true
          echo "---- gating on undefined/unbound-name errors ----"
          if python -m pyflakes air_llm/airllm 2>&1 | grep -E "undefined name|before assignment"; then
            echo "::error::pyflakes found undefined/unbound names"
            exit 1
          fi
