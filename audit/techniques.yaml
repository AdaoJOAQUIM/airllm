# techniques.yaml — Phase 0 : triage des 100 techniques de compression
#
# Mission : fork AirLLM = pipeline de codecs branchable (streaming disque->GPU
# couche par couche). On ne garde ACTIF que ce qui est lossless + composable +
# rapide. Le reste = registre documenté ou hors-scope. Aucun code mort.
#
# Colonnes :
#   nom               : technique
#   type              : codec_lossless | quantization_lossy | preprocessing_offline |
#                       architecture_remplacement | theorie_non_codable | non_verifie
#   composable_airllm : oui_plugin (hot-path load/KV) | oui_offline (pretraitement) | non
#   statut_reference  : verifie | introuvable | futur_suspect | source_douteuse
#   verdict           : implementer | documenter | hors_scope | rejeter
#   note              : justification d'UNE ligne
#
# Cutoff de verification : Hugging Face papers (25 juin 2026) + arxiv.org direct.
# IMPORTANT : "lossless" ici = bit-exact sur les poids OU logits identiques a
# tolerance flottante pres. Round-trip OBLIGATOIRE avant toute implementation.

meta:
  base: AirLLM (layer streaming, safetensors par couche)
  invariant: lossless = round-trip bit-exact, sinon REJETE
  resume_verdicts:                # comptage verifie ligne a ligne = 100
    implementer_plugin: 8        # ZipNN, NeuZip, source-coding, arith, ANS, MoE exact, AirLLM, KV
    documenter: 64               # reel mais hors hot-path / theorie / offline / pruning / quant lossy
    hors_scope: 28               # autres modeles (J), hypernets (F), systemes/memoire orthogonaux
    rejeter: 0                   # aucune fausse-lossless a rejeter d'office ; les lossy sont 'documenter' derriere flag
  alerte_references:
    - "Nacrith : URL 'arxiv-troller.com' = FAUSSE. Papier reel = arXiv:2602.19626."
    - "StateSMix (2605.02904) : reel mais mono-auteur/non relu -> documenter."
    - "Chained Lightweight Predictors (2604.15472) : reel (Kim & Belyaev, sous review)."

# =====================================================================
# A. Compression SANS PERTE des modeles IA (priorite maximale)
# =====================================================================
A:
  - nom: ZipNN (Lossless Compression for AI Models)
    type: codec_lossless
    composable_airllm: oui_plugin
    statut_reference: verifie          # arXiv:2411.05239
    verdict: implementer
    note: Codec lossless concu pour poids NN (~50% sur fp/bf16) ; cible exacte du fork.
  - nom: Lossless Compression of Deep Neural Networks (suppression composants redondants)
    type: preprocessing_offline
    composable_airllm: oui_offline
    statut_reference: verifie          # arXiv:2001.00218
    verdict: documenter
    note: Lossless par equivalence fonctionnelle mais transforme l'archi ; offline, pas hot-path.
  - nom: "'Lossless' DNN Compression via Neural Tangent Kernel (NTK)"
    type: theorie_non_codable
    composable_airllm: non
    statut_reference: verifie          # arXiv:2403.00258
    verdict: documenter
    note: Reparametrage mathematique theorique ; "lossless" au sens NTK, pas un codec d'octets.
  - nom: NeuZip (Memory-Efficient Training/Inference, Dynamic Compression)
    type: codec_lossless
    composable_airllm: oui_plugin
    statut_reference: verifie          # arXiv:2410.20650
    verdict: implementer
    note: Mode lossless = compression entropique de l'exposant ; s'insere dans load/decode.
  - nom: Lossless Weight Matrix Representations using Source Coding
    type: codec_lossless
    composable_airllm: oui_plugin
    statut_reference: verifie
    verdict: implementer
    note: Source coding direct des poids ; meme famille que ZipNN, round-trip exact.
  - nom: Entropy-Constrained Neural Network Compression
    type: preprocessing_offline
    composable_airllm: oui_offline
    statut_reference: verifie
    verdict: documenter
    note: Contrainte d'entropie a l'entrainement (lossy vs modele original) ; offline.
  - nom: Model Compression by Entropy Penalized Reparameterization
    type: preprocessing_offline
    composable_airllm: oui_offline
    statut_reference: verifie          # arXiv:1906.06624
    verdict: documenter
    note: Reparametrage penalise a l'entrainement ; pas un codec post-hoc lossless.
  - nom: Deep Compression (Pruning + Quantization + Huffman)
    type: quantization_lossy
    composable_airllm: oui_offline
    statut_reference: verifie          # arXiv:1510.00149
    verdict: documenter
    note: Pipeline lossy ; SEULE l'etape Huffman est un primitive entropique lossless reutilisable.
  - nom: Learning both Weights and Compression Codes
    type: preprocessing_offline
    composable_airllm: oui_offline
    statut_reference: verifie
    verdict: documenter
    note: Codes appris a l'entrainement ; necessite reentrainement, hors fork.
  - nom: Minimum Description Length (MDL) for Neural Networks
    type: theorie_non_codable
    composable_airllm: non
    statut_reference: verifie
    verdict: documenter
    note: Cadre theorique (doublon de B1) ; oriente le choix de codec, n'est pas du code.

